# SPDX-License-Identifier: GPL-3.0-or-later
name: macOS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'

jobs:
  build:
    # macos-14 is deprecated on GitHub's runners; 15 is the oldest image
    # still kept, and the arm64 one the machines people buy now run.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: brew install meson ninja pkg-config gtk4 pango cairo glib gdk-pixbuf poppler ccache python sqlite hunspell

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ github.sha }}
          restore-keys: ccache-macos-

      - name: Configure
        run: |
          export CC="ccache clang"
          ccache --max-size=200M
          ccache --zero-stats
          # No --werror: Apple clang warns about different things than the
          # GCC the other two jobs use, and a warning it invents on its own
          # should not turn the tree red.
          meson setup builddir

      - name: Build
        run: meson compile -C builddir

      - name: ccache statistics
        run: ccache --show-stats

      - name: Smoke test
        run: sh build-aux/smoke-test.sh builddir/src/office42-calc

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: office42-macos
          path: builddir/src/office42-calc
          retention-days: 14
