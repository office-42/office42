# SPDX-License-Identifier: GPL-3.0-or-later
name: Linux

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache gcc pkg-config meson ninja-build \
            libgtk-4-dev libpango1.0-dev libcairo2-dev libglib2.0-dev \
            libgdk-pixbuf-2.0-dev libpoppler-glib-dev \
            python3-dev libsqlite3-dev libhunspell-dev desktop-file-utils

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          export CC="ccache gcc"
          ccache --max-size=200M
          ccache --zero-stats
          meson setup builddir --werror

      - name: Build
        run: meson compile -C builddir

      - name: ccache statistics
        run: ccache --show-stats

      - name: Smoke test
        run: sh build-aux/smoke-test.sh builddir/src/office42-calc

      # The menu entry the desktop hands to the user; the spec is picky
      # and the tool that checks it is already installed above.
      - name: Validate the desktop entry
        run: desktop-file-validate data/net.office42.office42.desktop

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: office42-linux
          path: builddir/src/office42-calc
          retention-days: 14
