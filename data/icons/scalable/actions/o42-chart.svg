<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- office42 toolbar icon: a column chart on its axes
       Copyright (C) 2026 The office42 authors
       SPDX-License-Identifier: GPL-3.0-or-later

       Drawn in the sixteen colours a 1993 VGA had, on the 16-pixel grid:
       outlines are 1-pixel strokes down the half-pixel lines, fills sit on
       whole pixels.  The comment stays inside the element because
       gdk-pixbuf only sniffs the head of the file for "<svg".
  -->
  <path d="M3.5 8.5h3v5h-3z" fill="#ff0000" stroke="#000000"/>
  <path d="M7.5 5.5h3v8h-3z" fill="#ffff00" stroke="#000000"/>
  <path d="M11.5 2.5h3v11h-3z" fill="#0000ff" stroke="#000000"/>
  <path d="M2.5 1.5v12h13" fill="none" stroke="#000000"/>
</svg>
